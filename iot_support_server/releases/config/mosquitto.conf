# listener padrão mqtt
# com tls 8883
listener 1883 127.0.0.1
protocol mqtt

# permitir clientes sem autenticação (para dev/teste)
# TODO: Mudar para false
allow_anonymous true

# logs
log_dest stdout

log_type error
log_type warning
log_type notice
log_type information

# limites de recursos
max_connections -1
message_size_limit 0

# keepalive máximo permitido
max_keepalive 300

# fila offline
max_queued_messages 1000
max_queued_bytes 0

retain_available true