; platformio.ini — SmartParking Totem Firmware with SSAIoT

[platformio]
default_envs = esp32c3, esp8266

; ─── Configurações compartilhadas ───────────────────────────────────────────
[env]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -DSSAIOT_DEBUG=1
    -std=gnu++14
extra_scripts = pre:pre_build.py
lib_deps =
    symlink://../../../sdks/esp
    knolleary/PubSubClient@^2.8
    soburi/TinyCBOR@^0.5.3-arduino2
    arduino-libraries/LiquidCrystal@^1.0.7
    plerup/EspSoftwareSerial@^8.2.0


; ─── ESP32 ───────────────────────────────────────────────────────────────────
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ─── ESP8266 ─────────────────────────────────────────────────────────────────
[env:esp8266]
platform = espressif8266
board = nodemcu
build_flags =
    ${env.build_flags}
    -DBOARD_ESP8266